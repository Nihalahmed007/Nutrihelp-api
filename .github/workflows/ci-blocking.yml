name: BLOCKING CI/CD PIPELINE - NutriHelp API

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  OPENAPI_FILE: 'index.yaml'

# Add permissions for PR comments
permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== JOB 1: DEPENDENCY INSTALLATION ====================
  - name: Run ESLint against legacy baseline
  shell: bash
  run: |
    BASELINE=10607

    set +e
    npx eslint . --ext .js --format json --output-file eslint-results.json
    ESLINT_EXIT=$?
    set -e

    ERROR_COUNT=$(node -e "
      const fs = require('fs');
      const results = JSON.parse(fs.readFileSync('eslint-results.json', 'utf8'));
      console.log(results.reduce((total, file) => total + file.errorCount, 0));
    ")

    echo "Legacy ESLint baseline: ${BASELINE} errors"
    echo "Current ESLint errors: ${ERROR_COUNT}"

    if [ "$ERROR_COUNT" -gt "$BASELINE" ]; then
      echo "::error::ESLint errors increased from ${BASELINE} to ${ERROR_COUNT}."
      exit 1
    fi

    if [ "$ERROR_COUNT" -gt 0 ]; then
      echo "::warning::${ERROR_COUNT} legacy ESLint errors remain explicitly baselined."
    fi

    if [ "$ESLINT_EXIT" -ne 0 ] && [ "$ERROR_COUNT" -eq 0 ]; then
      echo "::error::ESLint failed for a reason other than reported lint errors."
      exit "$ESLINT_EXIT"
    fi

  # ==================== JOB 2: ESLINT - BLOCKING ====================
  lint:
  name: ESLint Code Quality
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Run ESLint
      run: npm run lint
  # ==================== JOB 3: PRETTIER - BLOCKING ====================
  format-check:
  name: Prettier Format Check
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Check formatting
      run: npm run format:check

  # ==================== JOB 4: UNIT TESTS - BLOCKING ====================
  unit-tests:
  name: Unit Tests
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Run unit tests
      run: npx mocha ./test/**/*.test.js --timeout 5000 --exit
      env:
        NODE_ENV: test

  # ==================== JOB 5: OPENAPI VALIDATION - BLOCKING ====================
  openapi-validate:
  name: OpenAPI Validation
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Validate OpenAPI
      run: npm run openapi:validate

  # ==================== JOB 6: SECURITY SCAN - BLOCKING ====================
  security-scan:
  name: Security Vulnerability Scan
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Run npm audit
      run: npm audit --audit-level=high

  # ==================== JOB 7: BUILD CHECK - BLOCKING ====================
  build-check:
  name: Build & Syntax Check
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Check JavaScript syntax
      run: npm run build
  # ==================== JOB 8: CODE COVERAGE - BLOCKING ====================
  code-coverage:
  name: Code Coverage
  runs-on: ubuntu-latest
  needs: install-deps
  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Restore node_modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

    - name: Run tests with coverage
      run: >
        npx nyc
        --check-coverage
        --lines 30
        --reporter=text-summary
        npx mocha ./test/**/*.test.js
        --timeout 5000
        --exit
      env:
        NODE_ENV: test
 

  # ==================== JOB 9: FINAL BLOCKING GATE ====================
  final-gate:
  name: Final Quality Gate
  runs-on: ubuntu-latest
  if: always()
  needs:
    - lint
    - format-check
    - unit-tests
    - openapi-validate
    - security-scan
    - build-check
    - code-coverage

  steps:
    - name: Verify all quality gates
      run: |
        echo "Checking all quality gates..."

        if [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.format-check.result }}" != "success" ] || \
           [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.openapi-validate.result }}" != "success" ] || \
           [ "${{ needs.security-scan.result }}" != "success" ] || \
           [ "${{ needs.build-check.result }}" != "success" ] || \
           [ "${{ needs.code-coverage.result }}" != "success" ]; then

          echo "One or more quality gates failed."
          echo "ESLint: ${{ needs.lint.result }}"
          echo "Prettier: ${{ needs.format-check.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "OpenAPI: ${{ needs.openapi-validate.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build Check: ${{ needs.build-check.result }}"
          echo "Code Coverage: ${{ needs.code-coverage.result }}"
          exit 1
        fi

        echo "All 7 quality gates passed."